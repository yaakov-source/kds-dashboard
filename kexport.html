<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>KDS key export</title>
<style>body{font:16px system-ui;margin:40px;max-width:640px}input{display:block;width:100%;margin:6px 0 14px;padding:8px}pre{white-space:pre-wrap;word-break:break-all;background:#eee;padding:12px}</style></head>
<body><h1>KDS key export</h1>
<form id="f" onsubmit="return false">
<label>Dashboard username<input id="u" name="username" autocomplete="username"></label>
<label>Password<input id="p" name="password" type="password" autocomplete="current-password"></label>
<button id="go" type="button">Generate</button></form>
<pre id="out"></pre>
<script src="data.enc.js?x=1"></script>
<script>
(function(){
var S=crypto.subtle,E=window.KDS_ENC,out=document.getElementById('out'),PUB={"kty":"RSA","n":"ym-V5fitaD2otcI-B8TjKzsKuVtntWMYMhCxWu6orSspnyuiEeki_488pQlGBcytkjCMe_fmyGhwK_vKE2RGcUNU-kxVYdcPQ4JKpQJySBYTVk_FdqZVL4Ii2QCStux-x5QBf-C0zK1inTE9hn-OQu9OKAkACXW82_tMpOQCqpW9-NFmvoH99PFxev0eRD5EvUzatzsjW8mtgakRejkHIkmIPh8Idkt417I-R-noBt-j-ZRWL_FAbpaXeEAhtGjqfpQTidIzPauteWhG1ygg_Y6SdFY_lAnl65vH3ggo2sEblYi0e7rYezJlAr5mxm698Tj3cxxtyjHwXYMMVFxTS_pv8Qh0OibhJVAbPUfR4-7slystFkFj-gjRsfv2LhMHaDs0gUACMuMfEurJCb_uIO9DUtiKPjmLORnqQPXoRcnKUdeNknszz6WZmrzhcQugvEFB_8EBeNanxUgSWREqzfLwCwjWChTKpP91Z8l5eRgtpD3Ns06JrzTD0tD-BTpHgOverElk9ACt1fg6Cw2tld2hJ8U0aTEp5NQFhx5xjzjxDIUbCbXfauh_VAWCvC5z1e2vXEyraJ8nVfx9Z3wm0XTUCN5OcDo7yCAKT6iCcPjbaSBGMwVGaIRlheVAdIQQQTBvRyMmr3tKBezbx0iDRJ9Vn3TzOL6l9ckSF3d-jyc","e":"AQAB"};
function ub(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function bu(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function kek(u,p,salt){return S.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveKey']).then(function(b){return S.deriveKey({name:'PBKDF2',salt:salt,iterations:E.iter,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt'])})}
document.getElementById('go').onclick=async function(){
 out.textContent='Working...';
 try{
  var u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value.trim().toUpperCase();
  var a=E.users[u]; if(!a)throw new Error('unknown user');
  var K=await S.decrypt({name:'AES-GCM',iv:ub(a.iv)},await kek(u,p,ub(a.salt)),ub(a.wk));
  var k=await S.importKey('raw',K,'AES-GCM',false,['decrypt']);await S.decrypt({name:'AES-GCM',iv:ub(E.iv)},k,ub(E.ct));
  var pk=await S.importKey('jwk',PUB,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
  out.textContent='VERIFIED\nSEALED='+bu(await S.encrypt({name:'RSA-OAEP'},pk,K));
 }catch(e){out.textContent='FAILED: '+(e.name||'')+' '+(e.message||'')}
};})();
</script></body></html>
